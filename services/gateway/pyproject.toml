[project]
name = "slopslingers-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.6.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.0.0",
  "readability-lxml>=0.8.1",
  "redis>=5.1.0",
  "nltk>=3.9.1",
  "snowballstemmer>=3.0.1",
  "spacy>=3.8.0",
  "spacy-lookups-data>=1.0.5",
  "trafilatura>=1.12.0",
  "uvicorn[standard]>=0.32.0",
  "voyageai>=0.3.4",
]

[tool.uv]
package = false

[project.optional-dependencies]
xgboost = [
  "scipy>=1.11.0",
  "xgboost>=2.1.0",
]
